name: Supabase production contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed schema without creating records
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/production_contracts.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/production_verification_contracts.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/adaptive_learning_contracts.sql
